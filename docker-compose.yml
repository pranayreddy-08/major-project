name: ecti-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ecti}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ecti}"
      POSTGRES_DB: "${POSTGRES_DB:-ecti}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecti} -d ${POSTGRES_DB:-ecti}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENVIRONMENT: "${APP_ENVIRONMENT:-development}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-ecti}:${POSTGRES_PASSWORD:-ecti}@postgres:5432/${POSTGRES_DB:-ecti}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      JWT_SECRET: "${JWT_SECRET:-development-only-change-this-jwt-secret}"
      JWT_ISSUER: "${JWT_ISSUER:-ecti-platform}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ecti-dashboard}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      LOGIN_RATE_LIMIT_PER_MINUTE: "${LOGIN_RATE_LIMIT_PER_MINUTE:-10}"
      SENSOR_INGEST_TOKEN: "${SENSOR_INGEST_TOKEN:-local-development-sensor-token-change-before-use-000000000000}"
    command: >-
      sh -c "python -m app.db.migrate &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
